<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mogambo AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-nav">
        <div class="brand">Mogambo Studio</div>
        <button class="new-chat-btn" onclick="location.reload()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Chat
        </button>
      </div>

      <div class="chat-history">
        <div class="history-label">Recent</div>
        <button class="history-item active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          What can you do
        </button>
        <button class="history-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Poem about the ocean
        </button>
        <button class="history-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Python Flask debugging
        </button>
      </div>

      <!-- Dummy Login Profile at bottom -->
      <div class="user-profile">
        <div class="avatar">
          <img src="https://ui-avatars.com/api/?name=Guest+User&background=171717&color=fff&rounded=true" alt="User Avatar" width="32" height="32" />
        </div>
        <div class="user-info">
          <span class="user-name">Guest User</span>
          <span class="user-status">Free Plan</span>
        </div>
        <button class="settings-btn" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <div>Mogambo Pure</div>
        <span>v1.0</span>
      </div>

      <div class="chat-container" id="chat-box">
        <div class="message-wrapper bot">
          <div class="message bot">
            Hello! I am Mogambo. How can I help you today?
          </div>
        </div>
      </div>

      <div class="input-container">
        <div class="suggestion-chips" id="suggestion-chips">
          <button class="chip" onclick="document.getElementById('user-input').value='what can you do'; document.getElementById('user-input').focus();">what can you do</button>
          <button class="chip" onclick="document.getElementById('user-input').value='how can i focus on study'; document.getElementById('user-input').focus();">how can i focus on study</button>
          <button class="chip" onclick="document.getElementById('user-input').value='do you know anything about weather'; document.getElementById('user-input').focus();">do you know anything about weather</button>
          <button class="chip" onclick="document.getElementById('user-input').value='what is 12 divided by 3'; document.getElementById('user-input').focus();">what is 12 divided by 3</button>
        </div>
        <div class="input-box">
          <input
            type="text"
            id="user-input"
            placeholder="Message Mogambo..."
            autocomplete="off"
          />
          <button onclick="sendMessage()" aria-label="Send message">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
